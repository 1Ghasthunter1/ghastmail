[package]
name = "ghastmailer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ghastmailer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring-core = "1.0.0"
apple-native-keyring-store = {version = "1.0.0", features = ["keychain"] }
openrouter-rs = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# Gmail account verification (see `src/gmail.rs`).
#
# `imap` 2.x has no rustls support; its default `tls` feature pulls native-tls,
# which on macOS is Security.framework — the system trust store, no C toolchain.
imap = "2.4.1"
native-tls = "0.2"
# `default-features = false` drops lettre's `builder`, so "verification never
# sends a probe message" is enforced by the type system: `Message` isn't
# compiled in at all. `tracing` is deliberately left OFF — it logs every SMTP
# command at debug level, including the base64 `AUTH PLAIN` blob.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "native-tls",
] }

